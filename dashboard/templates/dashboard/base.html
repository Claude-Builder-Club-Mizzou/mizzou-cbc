<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %} — CBC Mizzou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --terracotta: #D97757; --terracotta-dim: #B85F42;
      --terracotta-muted: rgba(217,119,87,0.12); --terracotta-border: rgba(217,119,87,0.50);
      --surface-base: #1C1917; --surface-raised: #231F1D; --surface-overlay: #2C2724; --surface-subtle: #292421;
      --text-primary: #E8E3DC; --text-secondary: #A89A8A; --text-faint: #8a7e76; --text-inverse: #1C1917;
      --border-default: #2E2926; --border-subtle: #252220; --border-strong: #403730;
      --font-heading: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'Lora', Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    h1, h2, h3, h4 { font-family: var(--font-heading); letter-spacing: -0.03em; }
    button, input, select, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface-raised); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); }
    ::-webkit-scrollbar-thumb:hover { background: var(--terracotta); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--surface-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--surface-raised);
      border-right: 1px solid var(--border-default);
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
    }
    .sidebar-brand {
      padding: 0 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-default);
      margin-bottom: 1rem;
    }
    .sidebar-brand h2 {
      font-size: 1rem;
      font-weight: 700;
    }
    .sidebar-brand h2 span { color: var(--terracotta); }
    .sidebar-brand p {
      font-size: 0.6875rem;
      color: var(--text-faint);
      margin-top: 0.125rem;
    }
    .sidebar-nav { flex: 1; }
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.5rem 1.25rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: color 0.15s, background 0.15s;
    }
    .sidebar-nav a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }
    .sidebar-nav a.active {
      color: var(--terracotta);
      background: rgba(217, 119, 87, 0.08);
    }
    .sidebar-nav a .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 1rem 1.25rem 0;
      border-top: 1px solid var(--border-default);
    }
    .sidebar-footer a {
      display: block;
      color: var(--text-faint);
      text-decoration: none;
      font-size: 0.8125rem;
      padding: 0.375rem 0;
      transition: color 0.15s;
    }
    .sidebar-footer a:hover { color: #f87171; }

    /* Main */
    .main {
      flex: 1;
      margin-left: 240px;
      padding: 2rem 2.5rem;
    }
    .page-header {
      margin-bottom: 2rem;
    }
    .page-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .page-header p {
      font-size: 0.875rem;
      color: var(--text-faint);
      margin-top: 0.25rem;
    }

    /* Cards */
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface-raised);
      border: 1px solid var(--border-default);
      border-radius: 4px;
      padding: 1.25rem;
    }
    .stat-card .stat-num {
      font-size: 2rem;
      font-weight: 700;
      color: var(--terracotta);
    }
    .stat-card .stat-label {
      font-size: 0.8125rem;
      color: var(--text-faint);
      margin-top: 0.25rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1rem;
      border-radius: 3px;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-gold {
      background: var(--terracotta);
      color: var(--text-inverse);
    }
    .btn-gold:hover { background: var(--terracotta-dim); }
    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }
    .btn-outline:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: relative; }
      .main { margin-left: 0; padding: 1.5rem; }
      body { flex-direction: column; }
    }

  
    /* Terminal-style accents matching the public site */
    .page-header h1::before { content: '~/ '; color: var(--terracotta); font-weight: 400; font-family: var(--font-mono); }
    .page-header p { font-family: var(--font-body); }
    .sidebar-nav a, .sidebar-footer a, .sidebar-brand p, .stat-card .stat-label { font-family: var(--font-mono); letter-spacing: 0.04em; }
    .sidebar-brand h2 { text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.875rem; }
    .sidebar-nav a { border-left: 2px solid transparent; }
    .sidebar-nav a.active { border-left-color: var(--terracotta); }
    .btn { font-family: var(--font-mono); letter-spacing: 0.04em; }
    .btn-gold { border: 1px solid var(--terracotta); }
    .stat-card:hover { border-color: var(--terracotta); }
    .stat-card { transition: border-color 0.2s; }
    .stat-card .stat-num { font-family: var(--font-heading); }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2><span>CBC</span> Mizzou</h2>
      <p>Exec Dashboard</p>
    </div>
    <nav class="sidebar-nav">
      <a href="{% url 'dashboard:home' %}" class="{% if active_page == 'home' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Overview
      </a>
      <a href="{% url 'dashboard:gallery' %}" class="{% if active_page == 'gallery' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Gallery
      </a>
      <a href="{% url 'dashboard:events' %}" class="{% if active_page == 'events' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Events
      </a>
      <a href="{% url 'dashboard:projects' %}" class="{% if active_page == 'projects' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
      </a>
      <a href="{% url 'dashboard:builders' %}" class="{% if active_page == 'builders' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Builders
      </a>
      <a href="{% url 'dashboard:team' %}" class="{% if active_page == 'team' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" target="_blank">← View Site</a>
      <a href="{% url 'dashboard:logout' %}">Sign Out</a>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
