{% load static %}
<div class="team-grid">
  {% for member in members %}
  <div class="team-card">
    <div class="team-top">
      {% if member.image_url %}
      <img src="{{ member.image_url }}" alt="{{ member.name }}" class="team-avatar">
      {% else %}
      <div class="team-avatar">{{ member.initials }}</div>
      {% endif %}
      <div>
        <div class="team-name">{{ member.name }}</div>
        <div class="team-role">{{ member.role }}</div>
        {% if member.is_ambassador %}<span class="team-ambassador"><span class="team-ambassador-logo" style="-webkit-mask-image:url('{% static 'landing/images/icons/claude-logo.svg' %}');mask-image:url('{% static 'landing/images/icons/claude-logo.svg' %}');"></span>Ambassador</span>{% endif %}
      </div>
    </div>
    <div class="team-major">{{ member.major }}</div>
    <div class="team-meta">
      <span class="team-order">Order #{{ member.order }}</span>
      <div class="team-actions">
        <a href="{% url 'dashboard:team_edit' member.pk %}">Edit</a>
        <form method="post" action="{% url 'dashboard:team_delete' member.pk %}" class="delete-form" onsubmit="return confirm('Remove this team member?');">
          {% csrf_token %}
          <button type="submit" class="delete-btn">Delete</button>
        </form>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
