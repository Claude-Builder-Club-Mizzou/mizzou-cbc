<div class="team-grid{% if stagger %} stagger-container{% endif %}">
  {% for m in members %}
  <div class="team-card{% if m.is_ambassador %} is-ambassador{% endif %}{% if stagger %} stagger-item{% endif %}">
    <span class="terminal-frame-label">{{ m.role }}</span>
    {% if m.image_url %}
    <img src="{{ m.image_url }}" alt="{{ m.name }}" class="avatar avatar-img" {% if not eager %}loading="lazy"{% endif %}>
    {% else %}
    <div class="avatar">{{ m.initials }}</div>
    {% endif %}
    <h3 class="text-heading" style="margin:0 0 0.25rem 0;">{{ m.name }}</h3>
    <div class="major text-muted">{{ m.major }}</div>
    {% if m.is_ambassador %}
    <div class="ambassador-badge">
      <span class="ambassador-logo" aria-hidden="true"></span>
      Anthropic Campus Ambassador
    </div>
    {% endif %}
    {% if m.linkedin %}
    <a href="{{ m.linkedin }}" target="_blank" rel="noopener noreferrer" class="linkedin-link" aria-label="{{ m.name }} on LinkedIn">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
      <span>LinkedIn</span>
      <span class="linkedin-arrow" aria-hidden="true">→</span>
    </a>
    {% endif %}
  </div>
  {% endfor %}
</div>
